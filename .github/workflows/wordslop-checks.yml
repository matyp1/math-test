name: WORD slop swap checks
on:
  push:
    branches:
      - feature/wordslop-drag-swap-nov26
  pull_request:
    branches:
      - build/five-slops-playtest
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check src/app.mjs
      - run: node --check src/drag-controls.mjs
